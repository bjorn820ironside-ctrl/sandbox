apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-frontend
  namespace: sandbox-k8s-lab4
  labels:
    app: sandbox-frontend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-frontend

  template:
    metadata:
      labels:
        app: sandbox-frontend

    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: ghcr.io/bjorn820ironside-ctrl/sandbox-frontend:sha-d71fae7
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8888
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
