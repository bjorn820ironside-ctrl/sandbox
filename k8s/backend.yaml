apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-backend
  namespace: sandbox-k8s-lab4
  labels:
    app: sandbox-backend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-backend

  template:
    metadata:
      labels:
        app: sandbox-backend

    spec:
      containers:
        - name: backend
          image: ghcr.io/bjorn820ironside-ctrl/sandbox-backend:sha-d71fae7
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
