
name: CI

on:
  push:
    branches: ['**']
  # workflow_dispatch:

    # inputs:
    #   VERSION:
    #     description: 'Previous version for redeploy/rollback; empty means new build'
    #     required: false
    #     type: string

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      owner: ${{ steps.set.outputs.owner }}
    steps:
      - name: Choose version
        id: set
        run: |
          set -euo pipefail

          VERSION="$(date -u +%Y%m%d-%H%M%S)"

          echo "Generated version: $VERSION"
          echo "Generated version: $VERSION" >> "$GITHUB_STEP_SUMMARY"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Go tests and reports
        run: |
          mkdir -p reports
          docker run --rm \
            --mount type=bind,src="$GITHUB_WORKSPACE/src/backend",dst=/src,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/reports",dst=/reports \
            -w /src \
            -e HOME=/tmp \
            -e GOPATH=/tmp/gopath \
            -e GOCACHE=/tmp/gocache \
            golang:1.27-alpine \
            sh -ec '
              go install gotest.tools/gotestsum@v1.13.0

              test_status=0
              "$GOPATH/bin/gotestsum" --junitfile /reports/junit.xml -- \
                -count=1 -coverprofile=/reports/coverage.out ./... || test_status=$?

              if [ -s /reports/coverage.out ]; then
                go tool cover -func=/reports/coverage.out > /reports/coverage.txt
                go tool cover -html=/reports/coverage.out -o /reports/coverage.html
              fi

              exit "$test_status"
            '

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  build:
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v6


      # - name: Configure HTTP Nexus
      #   env:
      #     NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
      #   run: |
      #     set -euo pipefail
      #     [[ -n "$NEXUS_HOST" && "$NEXUS_HOST" != *"://"* && "$NEXUS_HOST" != */* ]] || { echo 'NEXUS_HOST must be a registry host:port without a URL scheme or path'; exit 1; }
      #     printf '{"insecure-registries":["%s"]}\n' "$NEXUS_HOST" | sudo tee /etc/docker/daemon.json > /dev/null
      #     sudo systemctl restart docker
      #     printf '[registry."%s"]\n  http = true\n' "$NEXUS_HOST" > "$RUNNER_TEMP/buildkitd.toml"


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # with:
      #   buildkitd-config: ${{ runner.temp }}/buildkitd.toml


      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # - name: Login to Nexus
      #   uses: docker/login-action@v4
      #   with:
      #     registry: ${{ secrets.NEXUS_HOST }}
      #     username: ${{ secrets.NEXUS_REPO_USER }}
      #     password: ${{ secrets.NEXUS_REPO_PASS }}

      - name: Generate Docker tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.version.outputs.owner }}/sandbox-${{ matrix.component }}

          # images: ${{ secrets.NEXUS_HOST }}/khamitovar-${{ matrix.component }}-docker/sandbox-${{ matrix.component }}

          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./src/${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

