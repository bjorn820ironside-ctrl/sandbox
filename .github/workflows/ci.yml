name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Previous version for redeploy/rollback; empty means new build'
        required: false
        type: string

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      owner: ${{ steps.set.outputs.owner }}
    steps:
      - name: Choose version
        id: set
        env:
          REQUESTED_VERSION: ${{ inputs.VERSION }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_VERSION" ]]; then
            [[ "$REQUESTED_VERSION" =~ ^[0-9]{8}-[0-9]{6}$ ]] || { echo 'Invalid VERSION'; exit 1; }
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="$(date -u +%Y%m%d-%H%M%S)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  test:
    if: ${{ github.event_name == 'push' || inputs.VERSION == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Go tests and reports
        run: |
          mkdir -p reports
          docker run --rm \
            --mount type=bind,src="$GITHUB_WORKSPACE/src/backend",dst=/src,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/reports",dst=/reports \
            -w /src \
            -e HOME=/tmp \
            -e GOPATH=/tmp/gopath \
            -e GOCACHE=/tmp/gocache \
            golang:1.27-alpine \
            sh -ec '
              go install gotest.tools/gotestsum@v1.13.0

              test_status=0
              "$GOPATH/bin/gotestsum" --junitfile /reports/junit.xml -- \
                -count=1 -coverprofile=/reports/coverage.out ./... || test_status=$?

              if [ -s /reports/coverage.out ]; then
                go tool cover -func=/reports/coverage.out > /reports/coverage.txt
                go tool cover -html=/reports/coverage.out -o /reports/coverage.html
              fi

              exit "$test_status"
            '

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  build:
    needs: [version, test]
    if: ${{ github.event_name == 'push' || inputs.VERSION == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.version.outputs.owner }}/sandbox-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./src/${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: [version, build]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.version.result == 'success' && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.VERSION != '' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare files
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE || vars.APP_ENV_FILE }}
          OWNER: ${{ needs.version.outputs.owner }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          [[ -n "$APP_ENV_FILE" ]] || { echo 'APP_ENV_FILE is empty'; exit 1; }
          mkdir -p deploy-files
          REPO_BACKEND="ghcr.io/$OWNER/sandbox-backend"
          REPO_FRONTEND="ghcr.io/$OWNER/sandbox-frontend"
          {
            printf '%s\n' "$APP_ENV_FILE"
            printf 'IMAGE_REGISTRY=ghcr.io\n'
            printf 'IMAGE_TAG=%s\n' "$VERSION"
            printf 'VERSION=%s\n' "$VERSION"
            printf 'REPOSITORY_BACKEND=%s\n' "$REPO_BACKEND"
            printf 'REPOSITORY_FRONTEND=%s\n' "$REPO_FRONTEND"
          } > deploy-files/.env
          cp docker-compose.yaml deploy.sh deploy-files/

      - name: Deploy to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH_OPTS=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)

          ssh "${SSH_OPTS[@]}" "$VM_USER@$VM_HOST" 'mkdir -p ~/sandbox'
          scp "${SSH_OPTS[@]}" deploy-files/docker-compose.yaml deploy-files/.env deploy-files/deploy.sh \
            "$VM_USER@$VM_HOST:/home/$VM_USER/sandbox/"

          printf '%s' "$GHCR_TOKEN" | ssh "${SSH_OPTS[@]}" "$VM_USER@$VM_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh "${SSH_OPTS[@]}" "$VM_USER@$VM_HOST" 'cd ~/sandbox && bash ./deploy.sh'
