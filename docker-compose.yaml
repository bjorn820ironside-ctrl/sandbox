services:
  backend:
    image: ${REPOSITORY_BACKEND}:${IMAGE_TAG}
    env_file:
      - .env
    expose:
      - "8081"
    networks:
      - sandbox-network
    restart: unless-stopped

  frontend:
    image: ${REPOSITORY_FRONTEND}:${IMAGE_TAG}
    env_file:
      - .env
    ports:
      - "8888:8888"
    depends_on:
      - backend
    networks:
      - sandbox-network
    restart: unless-stopped

networks:
  sandbox-network:
    driver: bridge
